# The regenerate bot (bots/regenerate, set up in HomeLab) commits these generated files
# on Renovate's branches, so that the checks of ci.yml that compare them pass. It builds
# in the image of the CI job named here, with no token in reach of the dependencies'
# code, and pushes only commits with these messages that change these paths.
jobs:
  php:
    image_from: {file: .forgejo/workflows/ci.yml, job: standards}
    prepare: |
      apk add -q bash git unzip libzip bzip2 python3
      apk add -q --virtual .build $PHPIZE_DEPS libzip-dev bzip2-dev
      docker-php-ext-install -j"$(nproc)" zip bz2 > /dev/null
      apk del -q .build
      wget -q -O /tmp/composer-setup.php https://getcomposer.org/installer
      [ "$(wget -q -O - https://composer.github.io/installer.sig)" = \
        "$(php -r 'echo hash_file("sha384", "/tmp/composer-setup.php");')" ]
      php /tmp/composer-setup.php --quiet --2 --install-dir=/usr/local/bin --filename=composer
    install: composer install -q --no-interaction --no-progress
    steps:
      # The code as a new php-cs-fixer or coding standard formats it, only when the
      # branch changes one of them: a dependency's real findings still fail.
      - run: composer cs:fix
        paths: app/talk_ai tests
        message: "style: the code as the new php-cs-fixer formats it"
        when:
          - composer.lock "php-cs-fixer/shim"
          - composer.lock "nextcloud/coding-standard"
          - composer.lock "kubawerlos/php-cs-fixer-custom-fixers"
      # Psalm's baseline as a new Psalm records its findings (Psalm exits 2 while the
      # baseline holds findings; the check of ci.yml tells).
      - run: vendor/bin/psalm --threads=1 --no-cache --no-progress --set-baseline=psalm-baseline.xml > /dev/null || true
        paths: psalm-baseline.xml
        message: "chore(psalm): the baseline as the new Psalm records it"
        when: [composer.lock "vimeo/psalm"]
