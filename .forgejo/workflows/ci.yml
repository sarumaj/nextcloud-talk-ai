---
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The app's PHP must parse, follow Nextcloud's coding standard and pass Psalm, its
# info.xml must pass the app store's schema, the Markdown must pass markdownlint, and the
# tests (PHPUnit, no Nextcloud and no network) must pass against each supported
# Nextcloud's public API; on a real Nextcloud with PostgreSQL the app must upgrade from
# its app store release, run its jobs and pass tests/server/check.sh; Talk's bot and chat
# API must still have what the app uses; and the document golden set must pass with the
# sandbox image and the skills.
# A failure blocks the merge (branch protection: all checks required).
name: CI
# A failed job mails whoever started the run. Renovate's bot has no mailbox: when its
# branch fails, Renovate opens a pull request, which mails the repository's watchers.
enable-email-notifications: true
"on":
  push:
    branches: [main, "renovate/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: docker
    container: docker.io/library/composer:2
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The Nextcloud versions info.xml supports (min-version to max-version).
        ocp: [dev-stable32, dev-stable33, dev-stable34, dev-stable35, dev-master]
    steps:
      - name: Check out
        run: &checkout |
          git init -q . && git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Lint the PHP files
        run: find app -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check info.xml against the app store's schema
        run: |
          apk add -q libxml2-utils
          wget -q -O /tmp/info.xsd https://apps.nextcloud.com/schema/apps/info.xsd
          xmllint --noout --schema /tmp/info.xsd app/talk_ai/appinfo/info.xml

      - name: Run the tests against Nextcloud's API (${{ matrix.ocp }})
        run: |
          composer install -q --no-interaction --no-progress
          # Newer Nextcloud needs a newer PHP than the lowest one composer.json resolves for.
          composer config --unset platform.php
          composer require -q --dev --no-interaction -W "nextcloud/ocp:${{ matrix.ocp }}"
          vendor/bin/phpunit

  standards:
    runs-on: docker
    container: docker.io/library/composer:2
    timeout-minutes: 10
    steps:
      - name: Check out
        run: *checkout

      - name: Install the development tools
        run: composer install -q --no-interaction --no-progress

      - name: Check the coding standard
        run: composer cs:check

      - name: Check the PHP with Psalm
        run: composer psalm

  markdown:
    runs-on: docker
    container: docker.io/library/node:24-bookworm
    timeout-minutes: 10
    steps:
      - name: Check out
        run: *checkout

      - name: Check the Markdown with markdownlint
        run: npx --yes markdownlint-cli2 "*.md" "docs/**/*.md"

  server:
    # A whole Ubuntu with rootless Docker, for Nextcloud and PostgreSQL: the migrations,
    # repair steps, jobs, routes and commands that the API package alone does not run.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest Nextcloud info.xml supports and the newest released one (36 has no
        # image yet; the php job covers it with dev-master).
        nextcloud: ["32", "35"]
    steps:
      - name: Check out
        run: *checkout

      - name: Check the app on Nextcloud ${{ matrix.nextcloud }}
        uses: https://git.ciepiela.org/dawid/ci-actions/nextcloud-app-server@main
        with:
          app-id: talk_ai
          nextcloud: ${{ matrix.nextcloud }}
          # The bot is Talk's.
          apps: spreed
          check: tests/server/check.sh
          # Docs or translations alone need no server.
          paths: app/** tests/server/** .forgejo/workflows/ci.yml

  talk-api:
    runs-on: docker
    container: docker.io/library/python:3.12-slim
    timeout-minutes: 10
    steps:
      - name: Check out
        run: |
          apt-get update -qq && apt-get install -qq -y --no-install-recommends git ca-certificates >/dev/null
          git init -q . && git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Check Talk's API on its supported branches
        run: python3 tests/compat/talk_api.py

  golden:
    # A whole Ubuntu with rootless Docker, to build the sandbox image.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        run: *checkout

      - name: Build the sandbox image
        run: docker build -t talk-ai-sandbox:ci sandbox/

      - name: Build the External App's image
        run: docker build --build-arg BASE=talk-ai-sandbox:ci -t talk-ai-sandbox-exapp:ci -f sandbox/exapp/Dockerfile .

      - name: Run the document golden set
        run: tests/golden/run.sh talk-ai-sandbox:ci

      - name: Check the skill scripts parse
        run: |
          for f in skills/*/scripts/*.py; do python3 -m py_compile "$f"; done
          for f in skills/*/scripts/*.sh; do bash -n "$f"; done

