---
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# A tag vX.Y.Z (the version in appinfo/info.xml) becomes a release: the app as
# talk_ai-X.Y.Z.tar.gz on the Forgejo release, with the version's section of
# CHANGELOG.md as its text, signed with the app's key, and published on the
# Nextcloud app store, which hands this download to the servers that install it
# (the shared action nextcloud-app-release of dawid/ci-actions). A tag without its
# section in CHANGELOG.md (## X.Y.Z - YYYY-MM-DD) fails before anything is released.
#
# Secrets: APP_SIGNING_KEY, the private key of the app store certificate for
# talk_ai (PEM); APPSTORE_TOKEN, the API token of the store account
# (apps.nextcloud.com, account, API token). Without them the release still gets
# the archive, unsigned and not published.
name: Release
# A failed job mails whoever started the run. Renovate's bot has no mailbox: when its
# branch fails, Renovate opens a pull request, which mails the repository's watchers.
enable-email-notifications: true
"on":
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: docker
    container: docker.io/library/debian:bookworm-slim
    timeout-minutes: 15
    steps:
      - name: Install the tools
        run: apt-get update -qq && apt-get install -qq -y --no-install-recommends ca-certificates git openssl python3 >/dev/null

      - name: Check out
        run: |
          git init -q . && git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      # The app folder alone, named as the app, with the licence.
      - name: Release
        uses: https://git.ciepiela.org/dawid/ci-actions/nextcloud-app-release@main
        with:
          app-id: talk_ai
          include: LICENSE
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          signing-key: ${{ secrets.APP_SIGNING_KEY }}
          # Not on the app store until talk_ai is registered there (its certificate): the
          # store refuses an app it does not know, and the job failed after the release.
          app-store: "false"
          app-store-token: ${{ secrets.APPSTORE_TOKEN }}

  # The document sandbox's images in the registry beside the code (N-08):
  # <registry>/<owner>/talk-ai-sandbox:X.Y.Z (for the runner) and
  # <registry>/<owner>/talk-ai-sandbox-exapp:X.Y.Z (the External App, which AppAPI
  # pulls), each also :latest. Pushed with PACKAGES_TOKEN when set, else with the job's
  # own token, which may publish the owner's packages.
  sandbox-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out
        run: |
          git init -q . && git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Build the images
        run: |
          docker build -t talk-ai-sandbox:build sandbox/
          docker build --build-arg BASE=talk-ai-sandbox:build -t talk-ai-sandbox-exapp:build -f sandbox/exapp/Dockerfile .

      - name: Push the images
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          JOB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry="${{ github.server_url }}"; registry="${registry#https://}"
          owner="${{ github.repository_owner }}"
          token="${PACKAGES_TOKEN:-$JOB_TOKEN}"
          [ -n "$PACKAGES_TOKEN" ] || echo "::warning::No PACKAGES_TOKEN: trying the job's own token, which may not publish packages"
          echo "$token" | docker login "$registry" -u "$owner" --password-stdin
          for name in talk-ai-sandbox talk-ai-sandbox-exapp; do
            for tag in "${TAG#v}" latest; do
              docker tag "$name:build" "$registry/$owner/$name:$tag"
              docker push "$registry/$owner/$name:$tag"
            done
          done
