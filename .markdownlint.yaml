#
# Lines wrap at 100 characters, as in the homelab's documentation; long commands in code blocks
# and tables may run over.
MD013:
  line_length: 100
  code_blocks: false
  tables: false
# The changelog repeats "Added", "Fixed", ... under every version: only headings under the same
# parent must differ.
MD024:
  siblings_only: true
