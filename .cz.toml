# The release bot (release-bot on git.ciepiela.org) tags the releases due from the
# Conventional Commits and CHANGELOG.md's "## Unreleased" section; cz works locally too.
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "scm"
# Both apps' info.xml carry the release's version: the voice ExApp's stayed at 0.17.1 in 0.18.0.
version_files = ["app/talk_ai/appinfo/info.xml:<version>", "voice/exapp/appinfo/info.xml:<version>"]
