# The release bot (release-bot on git.ciepiela.org) tags the releases due from the
# Conventional Commits and CHANGELOG.md's "## Unreleased" section; cz works locally too.
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "scm"
version_files = ["app/talk_ai/appinfo/info.xml:<version>"]
